name = "internet-mindmap-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[vars]
# API Worker URL — used as Better Auth's baseURL. Must be the Worker's own URL.
BETTER_AUTH_URL = "http://localhost:8787"
# Web app URL — used for post-auth redirects and trusted origins.
APP_BASE_URL = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "internet-mindmap"
database_id = "placeholder-create-with-wrangler"

[[vectorize]]
binding = "VECTORIZE"
index_name = "internet-mindmap-embeddings"
remote = true

[ai]
binding = "AI"

[[workflows]]
binding = "PROCESS_ITEM"
name = "process-item"
class_name = "ProcessItemWorkflow"
