name = "internet-mindmap-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Better Auth baseURL — the web app origin (Next.js), NOT the Worker URL.
BETTER_AUTH_URL = "https://internet-mindmap.vercel.app"
# Web app URL — used for post-auth redirects and trusted origins.
APP_BASE_URL = "https://internet-mindmap.vercel.app"
MCP_WORKER_ORIGIN = "https://internet-mindmap-api.chaturchacharost.workers.dev"

# LLM model overrides (defaults live in ai/llm/models.ts).
# Uncomment to override on the next deployment. Free-plan options:
#   synthesis: @cf/qwen/qwen3.8-27b | @cf/google/gemma-4-26b-a4b-it
#   auxiliary: @cf/openai/gpt-oss-20b   | @cf/qwen/qwen3-30b-a3b-fp8
# LLM_SYNTHESIS = "@cf/qwen/qwen3.8-27b"
# LLM_AUXILIARY = "@cf/openai/gpt-oss-20b"
# LLM_TAGGING   = "@cf/openai/gpt-oss-20b"

# BYOK encryption: provision PROVIDER_KEY_KEK_V1 as a secret (base64 32 random bytes).
# Back it up in a password manager. Do not put provider keys or KEKs in [vars].
#   wrangler secret put PROVIDER_KEY_KEK_V1

# DATABASE_URL is set as a Worker secret (not a var — keeps connection string out of source):
#   wrangler secret put DATABASE_URL
# Paste your Neon pooled connection string:
#   postgres://user:pass@ep-xxx.neon.tech/neondb?sslmode=require

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Each namespace is account-wide and must be reserved for this route.
[[ratelimits]]
name = "SETTINGS_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "SAVE_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# Native bindings support only 10s/60s windows; imports use 5/min, not 5/hour.
[[ratelimits]]
name = "IMPORT_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true

[[workflows]]
binding = "PROCESS_ITEM"
name = "process-item"
class_name = "ProcessItemWorkflow"
