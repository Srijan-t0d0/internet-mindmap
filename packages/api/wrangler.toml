name = "internet-mindmap-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Better Auth baseURL — the web app origin (Next.js), NOT the Worker URL.
# OAuth callbacks are routed through the Next.js proxy (/api/auth/*), so the
# callback URL sent to Google must be the Next.js origin. This also ensures
# session cookies are set on the web app domain, not the Worker domain.
# Note: Better Auth's getBaseURL() auto-appends basePath ("/api/auth").
BETTER_AUTH_URL = "http://localhost:3030"
# Web app URL — used for post-auth redirects and trusted origins.
APP_BASE_URL = "http://localhost:3030"

[[d1_databases]]
binding = "DB"
database_name = "internet-mindmap"
database_id = "ef4d0900-8385-4849-838c-989a8276f593"

[[vectorize]]
binding = "VECTORIZE"
index_name = "internet-mindmap-embeddings"
remote = true

[ai]
binding = "AI"

[[workflows]]
binding = "PROCESS_ITEM"
name = "process-item"
class_name = "ProcessItemWorkflow"
