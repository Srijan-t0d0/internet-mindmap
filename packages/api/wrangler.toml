name = "internet-mindmap-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Better Auth baseURL — the web app origin (Next.js), NOT the Worker URL.
BETTER_AUTH_URL = "https://internet-mindmap.vercel.app"
# Web app URL — used for post-auth redirects and trusted origins.
APP_BASE_URL = "https://internet-mindmap.vercel.app"

# DATABASE_URL is set as a Worker secret (not a var — keeps connection string out of source):
#   wrangler secret put DATABASE_URL
# Paste your Neon pooled connection string:
#   postgres://user:pass@ep-xxx.neon.tech/neondb?sslmode=require

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[[workflows]]
binding = "PROCESS_ITEM"
name = "process-item"
class_name = "ProcessItemWorkflow"
